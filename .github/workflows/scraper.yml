name: Update Movie Showtimes

on:
  schedule:
    # Run daily at 8 PM Paris time (19:00 UTC in winter, 18:00 UTC in summer)
    # Using 19:00 UTC as default
    - cron: '0 19 * * *'
  
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run scraper
      run: python scraper.py
      
    - name: Generate RSS feed
      run: python rss_generator.py
      
    - name: Commit and push if changed
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add results.json results_history.json movie_feed.xml
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update movie showtimes [skip ci]" && git push)
